name: Release X8 Desktop (Windows)

# The fork's updater channel. release-desktop.yml belongs to upstream: it releases
# upstream's tags, validates them against unslothai/unsloth, and needs the signing,
# notarization and Azure secrets that only upstream holds. This workflow publishes
# this fork's own Windows build, signed with this fork's updater key, together with
# the latest.json that studio/src-tauri/tauri.conf.json points at:
#
#   https://github.com/GoldodemonINC/unsloth_8X/releases/latest/download/latest.json
#
# One release carries three builds of the same app, one per flavor (cpu, gpu,
# cpu-gpu). They differ only in the environment the desktop shell hands to the
# first-run installer, which install.rs bakes in from UNSLOTH_DESKTOP_FLAVOR:
#
#   cpu      torch index pinned to cpu, llama.cpp on cpu: no GPU probe, no CUDA
#   gpu      CUDA llama.cpp; the torch leaf stays unpinned because it follows the driver
#   cpu-gpu  no pinning at all: probe and install whatever the machine can run
#
# The updater is pointed at cpu-gpu and only at cpu-gpu. Tauri's manifest carries one
# entry per target triple, so three cannot be expressed, and the universal build is
# the only one that cannot be wrong for the machine that receives it. The narrow
# flavors are there for a user who deliberately downloads one.
#
# Three properties decide whether an installed app ever sees the result, and all are
# enforced below rather than left to the operator:
#
#   * the tag is v<version> exactly, because desktop_update_policy.rs only trusts
#     asset URLs under /releases/download/v<version>/ for the version the manifest
#     declares;
#   * the release is neither a draft nor a prerelease, because /releases/latest
#     skips both and the endpoint above is a /latest/ URL;
#   * the signature is present and non-empty, because every client verifies it
#     against the public key baked into the build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, no leading v and no suffix (for example 2026.4.9)'
        type: string
        required: true
      notes:
        description: 'Release notes, shown in the app''s update popup'
        type: string
        required: false
      draft:
        description: 'Build and sign without publishing; drafts never reach clients'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-x8-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build and sign (${{ matrix.flavor }})
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # One leg failing must not cancel the others: a run that reports on all three
      # is what tells you whether the CPU build was the problem or the flavor itself.
      fail-fast: false
      matrix:
        # The universal build is last, so a run stopped early has already produced the
        # one the updater wants.
        flavor: [cpu, gpu, cpu-gpu]
    env:
      APP_VERSION: ${{ inputs.version }}
      FLAVOR: ${{ matrix.flavor }}
      # The bundle directory holds one name for all three flavors, so each leg stages
      # its own under the name it will be uploaded as.
      FLAVOR_ASSET: Unsloth_${{ inputs.version }}_x64-${{ matrix.flavor }}-setup.exe

    steps:
      - uses: actions/checkout@v4

      # The tag is hand-typed, and a stray character here publishes a release that
      # no client can ever install. Refuse anything that is not plain SemVer before
      # a runner starts compiling.
      - name: Validate version and tag
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be plain SemVer with no leading v and no prerelease suffix: $RAW_VERSION" >&2
            echo "The updater compares this string against the installed build, and the" >&2
            echo "manifest URL is checked against /releases/download/v<version>/ exactly." >&2
            exit 1
          fi
          echo "Building v${RAW_VERSION} as ${FLAVOR}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Must run BEFORE any `npm ci`: the publish job has contents: write, so a
      # compromised lockfile's postinstall script could publish attacker-built binaries.
      - name: Lockfile supply-chain audit (pre-install scan)
        shell: bash
        run: python scripts/lockfile_supply_chain_audit.py

      - name: Install pinned Tauri CLI
        run: npm ci --prefix studio --no-fund --no-audit

      - name: Verify pinned Tauri CLI
        shell: bash
        run: |
          out="$(npx --prefix studio tauri --version)"
          echo "$out"
          if [ "$out" != "tauri-cli 2.10.1" ]; then
            echo "Expected tauri-cli 2.10.1, got $out" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      # The bundle reports whatever version Cargo.toml declares, and that is also what
      # latest.json declares. Without this the tag and the manifest disagree and every
      # client either sees no update or installs the wrong one.
      - name: Patch desktop app version
        shell: bash
        working-directory: studio/src-tauri
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PYTHON=python3; else PYTHON=python; fi
          "$PYTHON" <<'PY'
          import os
          import pathlib
          import re
          import sys

          app_version = os.environ['APP_VERSION']
          if not app_version:
              sys.exit('APP_VERSION is required')

          cargo_toml = pathlib.Path('Cargo.toml')
          lines = cargo_toml.read_text().splitlines(keepends = True)
          in_package = False
          patched = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == '[package]':
                  in_package = True
                  continue
              if stripped.startswith('[') and stripped.endswith(']'):
                  in_package = False
              if in_package and re.fullmatch(r'version\s*=\s*"[^"]+"', stripped):
                  lines[index] = f'version = "{app_version}"\n'
                  patched = True
                  break
          if not patched:
              sys.exit('Could not patch [package] version in Cargo.toml')
          cargo_toml.write_text(''.join(lines))

          cargo_lock = pathlib.Path('Cargo.lock')
          lock_text = cargo_lock.read_text()
          lock_text, count = re.subn(
              r'(?m)(^\[\[package\]\]\nname = "unsloth-studio"\nversion = ")[^"]+(")',
              lambda match: f'{match.group(1)}{app_version}{match.group(2)}',
              lock_text,
          )
          if count != 1:
              sys.exit(f'Could not patch unsloth-studio version in Cargo.lock (matches={count})')
          cargo_lock.write_text(lock_text)
          PY

          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          "$PYTHON" <<'PY'
          import json
          import os
          import pathlib
          import sys

          app_version = os.environ['APP_VERSION']
          metadata = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'cargo-metadata.json').read_text())
          versions = [p['version'] for p in metadata.get('packages', []) if p.get('name') == 'unsloth-studio']
          if versions != [app_version]:
              sys.exit(f'cargo metadata unsloth-studio version mismatch: expected {app_version}, got {versions}')
          PY

      # tauri-bundler fetches the NSIS toolset and WebView2 bootstrapper with one
      # unretried GET after the whole compile; seeding it here turns a transient
      # 504 into a slow run instead of a failed release.
      - name: Prefetch Tauri Windows bundler tools
        shell: pwsh
        run: .github/scripts/prefetch-tauri-windows-tools.ps1

      # Without a key the build silently produces unsigned bundles, latest.json
      # carries an empty signature, and every client rejects the update. Fail here
      # instead, where the message names the fix.
      - name: Require the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set on this repository." >&2
            echo "Add the contents of studio/src-tauri/x8-updater.key as a repository" >&2
            echo "secret; the matching public key is already embedded in tauri.conf.json." >&2
            echo "An update signed with any other key is refused by every installed app." >&2
            exit 1
          fi

      # UNSLOTH_DESKTOP_FLAVOR is read by option_env! in install.rs and becomes the
      # environment the first-run installer is given. build.rs declares it as a build
      # input, so the three legs cannot share a cached crate.
      - name: Build, sign and stage the ${{ matrix.flavor }} installer
        shell: bash
        working-directory: studio
        env:
          UNSLOTH_DESKTOP_FLAVOR: ${{ matrix.flavor }}
          # This fork has no Azure Trusted Signing account. The update bundle still gets
          # its mandatory Tauri signature from the key below; only the optional Windows
          # publisher certificate is omitted.
          UNSLOTH_SKIP_AUTHENTICODE: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The generated key has no password. Explicit rather than unset: with the
          # variable absent, tauri prompts for one and the job hangs until timeout.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          # The CLI's own entry point rather than the .bin shim, matching
          # scripts/release_x8_local.py.
          node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis

          raw="src-tauri/target/release/bundle/nsis/Unsloth_${APP_VERSION}_x64-setup.exe"
          if [ ! -f "$raw" ]; then
            echo "no installer at $raw; the bundle step did not produce one" >&2
            ls -la src-tauri/target/release/bundle/nsis/ >&2 || true
            exit 1
          fi
          if [ ! -s "$raw.sig" ]; then
            echo "no non-empty signature beside the installer: the build was unsigned" >&2
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release-out"
          cp "$raw" "$GITHUB_WORKSPACE/release-out/$FLAVOR_ASSET"
          cp "$raw.sig" "$GITHUB_WORKSPACE/release-out/$FLAVOR_ASSET.sig"
          ls -l "$GITHUB_WORKSPACE/release-out"

      - name: Upload the signed installer
        uses: actions/upload-artifact@v4
        with:
          name: x8-installer-${{ matrix.flavor }}
          # Spelled out rather than taken from env.FLAVOR_ASSET: the `env` context is
          # not one of the contexts `with:` may read.
          path: release-out/Unsloth_${{ inputs.version }}_x64-${{ matrix.flavor }}-setup.exe*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Assemble the manifest and publish
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      # Every flavor in one directory, so the differences below can be checked rather
      # than assumed. merge-multiple drops the per-leg subdirectories.
      - name: Collect the signed installers
        uses: actions/download-artifact@v4
        with:
          pattern: x8-installer-*
          path: release-out
          merge-multiple: true

      # UNSLOTH_DESKTOP_FLAVOR is a compile-time value, so a cached crate would be
      # repackaged three times: three assets, three signatures and one behaviour
      # between them, which looks exactly like a good release from the filenames.
      - name: Assert the flavors are actually different builds
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PYTHON=python3; else PYTHON=python; fi
          "$PYTHON" <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          version = os.environ['APP_VERSION']
          directory = pathlib.Path('release-out')
          seen = {}
          for flavor in ('cpu', 'gpu', 'cpu-gpu'):
              asset = directory / f'Unsloth_{version}_x64-{flavor}-setup.exe'
              if not asset.is_file():
                  sys.exit(f'missing {asset.name}; the {flavor} leg produced no installer')
              signature = asset.with_name(asset.name + '.sig')
              if not signature.is_file() or not signature.read_text().strip():
                  sys.exit(f'{asset.name} has no non-empty signature')
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              if digest in seen:
                  sys.exit(f'{seen[digest]} and {flavor} are byte-identical ({digest[:12]}), '
                           'so UNSLOTH_DESKTOP_FLAVOR did not reach the build')
              seen[digest] = flavor
          print('three distinct, signed installers')
          PY

      # Tauri's updater manifest has one entry per target triple, so exactly one flavor
      # can be the update. It is the universal build: pointing a machine at a narrower
      # one is the single choice that can strand it.
      - name: Assemble latest.json
        shell: bash
        # Through the environment rather than interpolated into the script: notes are
        # free text, and a quote or a $( in them would otherwise run as shell.
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PYTHON=python3; else PYTHON=python; fi
          "$PYTHON" <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          from datetime import datetime, timezone

          version = os.environ['APP_VERSION']
          asset_name = f'Unsloth_{version}_x64-cpu-gpu-setup.exe'
          directory = pathlib.Path('release-out')
          signature = (directory / f'{asset_name}.sig').read_text().strip()
          if not signature:
              raise SystemExit('the universal build has no signature')

          notes = os.environ.get('NOTES') or f'Unsloth X8 desktop build {version}.'
          manifest = {
              'version': version,
              'notes': notes,
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'windows-x86_64': {
                      'signature': signature,
                      'url': 'https://github.com/GoldodemonINC/unsloth_8X/releases/download/'
                             f'v{version}/{urllib.parse.quote(asset_name)}',
                  }
              },
          }
          path = directory / 'latest.json'
          path.write_text(json.dumps(manifest, indent = 2) + '\n')
          print(path.read_text())
          PY

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; re-uploading over it."
            exit 0
          fi
          # A draft can never be the latest release and gh refuses the combination, so
          # it is not offered --latest. Everything else is published as latest, because
          # the app reads /releases/latest and a release that is not it serves nothing.
          draft_flag=""
          latest_flag="--latest"
          if [ "$IS_DRAFT" = "true" ]; then
            draft_flag="--draft"
            latest_flag=""
          fi
          notes="$RELEASE_NOTES"
          if [ -z "$notes" ]; then
            notes="Unsloth X8 desktop build ${APP_VERSION}."
          fi
          gh release create "$RELEASE_TAG" $draft_flag $latest_flag \
            --title "Unsloth X8 ${APP_VERSION}" \
            --notes "$notes"

      - name: Upload installers, signatures and latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-out/*.exe release-out/*.sig release-out/latest.json --clobber

      # Read the manifest back from the release rather than from the build directory: a
      # manifest that exists locally but was not uploaded updates nobody. Skipped for a
      # draft, which is not reachable and is not meant to be.
      - name: Verify the published manifest is what clients will read
        if: ${{ !inputs.draft }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/latest.json"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          if command -v python3 >/dev/null 2>&1; then PYTHON=python3; else PYTHON=python; fi
          "$PYTHON" - "$manifest" <<'PY'
          import json
          import os
          import pathlib
          import sys

          tag = os.environ['RELEASE_TAG']
          version = os.environ['APP_VERSION']
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if data.get('version') != version:
              sys.exit(f'latest.json version {data.get("version")!r} != {version!r}')

          entry = (data.get('platforms') or {}).get('windows-x86_64')
          if not isinstance(entry, dict):
              sys.exit(f'latest.json has no windows-x86_64 entry: {sorted((data.get("platforms") or {}))}')
          if not (entry.get('signature') or '').strip():
              sys.exit('windows-x86_64 entry has no signature; every client would reject it')

          expected = f'https://github.com/GoldodemonINC/unsloth_8X/releases/download/{tag}/'
          url = entry.get('url') or ''
          if not url.startswith(expected):
              sys.exit(f'windows-x86_64 URL is not pinned to {tag}: {url}')
          if 'cpu-gpu' not in url:
              sys.exit(f'windows-x86_64 must name the universal build, not a narrow flavor: {url}')
          PY

          # The narrow flavors are not the update, but a release that silently dropped
          # them is the failure this whole workflow exists to avoid.
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for flavor in cpu gpu cpu-gpu; do
            name="Unsloth_${APP_VERSION}_x64-${flavor}-setup.exe"
            if ! printf '%s\n' "$assets" | grep -qx "$name"; then
              echo "::error::$RELEASE_TAG is missing $name"
              exit 1
            fi
          done

          latest="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "::warning::GitHub latest is $latest, not $RELEASE_TAG; clients keep reading the older manifest until this release becomes latest."
          fi
